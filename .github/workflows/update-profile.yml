name: Update profile
on:
  schedule:
    - cron: "0 3 * * *"   # every day, 07:00 UAE
  workflow_dispatch:       # the Run button
  push:
    paths: ["profile.json", "scripts/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_build_readme.py
      - run: python3 scripts/build_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update profile: newest repos"
          git push
